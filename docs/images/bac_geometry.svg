<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Bilateral Arc Clearance geometry</title>
  <desc id="desc">A rectangular robot evaluates constant-curvature candidate arcs. The selected arc balances the nearest obstacle clearance on its left and right sides while following a local path.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #172033; }
      .label { font-size: 18px; font-weight: 600; }
      .note { font-size: 15px; }
    </style>
  </defs>

  <rect width="960" height="440" rx="18" fill="#f8fafc"/>
  <path d="M 70 75 L 900 75" stroke="#475569" stroke-width="5"/>
  <path d="M 70 365 L 900 365" stroke="#475569" stroke-width="5"/>
  <text x="78" y="55" class="note">corridor wall / obstacle points</text>

  <g fill="#64748b">
    <circle cx="260" cy="75" r="5"/><circle cx="315" cy="75" r="5"/><circle cx="370" cy="75" r="5"/>
    <circle cx="425" cy="75" r="5"/><circle cx="480" cy="75" r="5"/><circle cx="535" cy="75" r="5"/>
    <circle cx="260" cy="365" r="5"/><circle cx="315" cy="365" r="5"/><circle cx="370" cy="365" r="5"/>
    <circle cx="425" cy="365" r="5"/><circle cx="480" cy="365" r="5"/><circle cx="535" cy="365" r="5"/>
  </g>

  <path d="M 205 235 C 375 226, 570 218, 835 220" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="12 10"/>
  <circle cx="835" cy="220" r="9" fill="#7c3aed"/>
  <text x="792" y="198" class="label" fill="#7c3aed">local goal</text>

  <path d="M 250 220 C 445 210, 650 137, 840 158" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="9 8"/>
  <path d="M 250 220 C 445 225, 650 297, 840 280" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="9 8"/>
  <text x="700" y="120" class="note">other admissible arcs</text>

  <path d="M 250 220 C 455 217, 650 190, 850 220" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <text x="605" y="177" class="label" fill="#2563eb">selected candidate arc</text>

  <g transform="translate(220 220)">
    <rect x="-78" y="-55" width="156" height="110" rx="6" fill="#f59e0b" fill-opacity="0.9" stroke="#9a5b00" stroke-width="3"/>
    <path d="M 45 0 L 78 0" stroke="#172033" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <text x="-65" y="6" class="label">robot</text>
  </g>

  <path d="M 510 205 L 510 80" stroke="#15803d" stroke-width="4" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <text x="525" y="135" class="label" fill="#15803d">c<tspan baseline-shift="sub" font-size="13">left</tspan></text>
  <path d="M 555 216 L 555 360" stroke="#15803d" stroke-width="4" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <text x="570" y="310" class="label" fill="#15803d">c<tspan baseline-shift="sub" font-size="13">right</tspan></text>

  <rect x="655" y="324" width="250" height="82" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="675" y="350" class="note">clearance reward:</text>
  <text x="675" y="378" class="label">min(c<tspan baseline-shift="sub" font-size="13">left</tspan>, c<tspan baseline-shift="sub" font-size="13">right</tspan>)</text>
  <text x="675" y="398" class="note">+ tight-space balance penalty</text>
</svg>
