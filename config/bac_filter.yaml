bac_filter:
  ros__parameters:
    # Example robot geometry. Measure these values on the target robot.
    footprint.front: 0.5
    footprint.rear: -0.5
    footprint.width: 0.95
    safety_margin.front: 0.2
    safety_margin.rear: 0.2
    safety_margin.side: 0.2
    avoid_margin.side: 0.6

    limits.v_max: 0.4
    limits.v_min: 0.0
    limits.w_max: 1.0
    limits.acc_v: 0.8
    limits.acc_w: 2.5
    control_period: 0.05
    stop_decel: 0.8

    scan_timeout: 0.5
    cmd_timeout: 0.5
    odom_timeout: 0.5
    scan_min_points: 10
    scan_inf_is_valid: true
    sensor.x: 0.0
    sensor.y: 0.0
    sensor.yaw: 0.0
    virtual_path_length: 3.0
